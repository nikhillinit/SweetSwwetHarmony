[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonic-discovery-engine"
version = "0.1.0"
requires-python = ">=3.11"
description = "Consumer deal-sourcing engine for Press On Ventures"

[tool.setuptools.packages.find]
namespaces = true
include = [
    "api*",
    "collectors*",
    "connectors*",
    "consumer*",
    "dashboard*",
    "discovery_engine*",
    "distribution*",
    "enrichment*",
    "importers*",
    "integrations*",
    "intelligence*",
    "monitoring*",
    "ops*",
    "profilers*",
    "services*",
    "storage*",
    "utils*",
    "verification*",
    "visualization*",
    "workflows*",
]

[tool.ruff]
target-version = "py311"
# Vendored / non-source trees that should never be linted.
extend-exclude = [".worktrees", ".a5c", ".ecc-install-20260421", "backups", ".omx"]

[tool.ruff.lint]
# Conservative starter set: pyflakes (F), critical pycodestyle errors (E4/E7/E9),
# and import sorting (I). Widen over time once the tree is clean.
select = ["E4", "E7", "E9", "F", "I"]
