[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonic-discovery-engine"
version = "0.1.0"
requires-python = ">=3.11"
description = "Consumer deal-sourcing engine for Press On Ventures"

[tool.setuptools.packages.find]
namespaces = true
include = [
    "api*",
    "collectors*",
    "connectors*",
    "consumer*",
    "dashboard*",
    "discovery_engine*",
    "distribution*",
    "enrichment*",
    "importers*",
    "integrations*",
    "intelligence*",
    "monitoring*",
    "ops*",
    "profilers*",
    "services*",
    "storage*",
    "utils*",
    "verification*",
    "visualization*",
    "workflows*",
]
