name: 'Failure Issue'
description: >-
  Open or update ONE tracking issue for a workflow failure, or close it on
  recovery. Deduplicates by label: in 'open' mode, if an open issue carrying
  the label exists, a comment with the new occurrence is added instead of
  creating a duplicate issue; in 'close' mode, any open issue carrying the
  label is commented with the recovering run and closed. Requires
  'issues: write' on the calling job.

inputs:
  title:
    description: 'Issue title used when creating the tracking issue'
    required: true
  label:
    description: >-
      Dedupe label. An open issue with this label is updated (commented on)
      instead of opening a new one, or closed in 'close' mode.
    required: true
  mode:
    description: >-
      'open' (default) opens or updates the tracking issue on failure.
      'close' closes any open issue carrying the label, commenting with a
      link to the recovering (first green) run.
    required: false
    default: 'open'
  body:
    description: 'Issue/comment body (markdown). Run metadata is appended automatically.'
    required: true
  workflow-name:
    description: 'Human-readable workflow name referenced in the issue'
    required: false
    default: ${{ github.workflow }}
  github-token:
    description: 'Token used to list/create/comment on issues'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Open, update, or close tracking issue
      uses: actions/github-script@v7
      env:
        ISSUE_TITLE: ${{ inputs.title }}
        ISSUE_LABEL: ${{ inputs.label }}
        ISSUE_BODY: ${{ inputs.body }}
        ISSUE_MODE: ${{ inputs.mode }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const title = process.env.ISSUE_TITLE;
          const label = process.env.ISSUE_LABEL;
          const mode = process.env.ISSUE_MODE || 'open';
          const workflowName = process.env.WORKFLOW_NAME;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const body = [
            process.env.ISSUE_BODY,
            '',
            '---',
            `Workflow: ${workflowName}`,
            `Run date: ${new Date().toISOString()}`,
            `[View workflow run](${runUrl})`,
          ].join('\n');

          if (mode !== 'open' && mode !== 'close') {
            core.setFailed(`Unknown mode '${mode}' (expected 'open' or 'close')`);
            return;
          }

          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          if (mode === 'close') {
            if (issues.data.length === 0) {
              core.info(`No open tracking issue with label '${label}'; nothing to close`);
              return;
            }
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed tracking issue #${issue.number} after recovery`);
            }
            return;
          }

          if (issues.data.length > 0) {
            const existing = issues.data[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: body,
            });
            core.info(`Updated existing tracking issue #${existing.number}`);
          } else {
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: [label, 'automated'],
            });
            core.info(`Created tracking issue #${created.data.number}`);
          }
