name: PR Evidence Gate

# Enforces the evidence-bundle policy from CONTRIBUTING.md for storage- and
# thesis-sensitive PRs: the PR body must cite a GitHub Actions run that exists,
# is tied to this PR's head SHA, and concluded success (`--live`). If live
# verification cannot run (e.g. a `gh` API outage, or a bootstrap PR that
# hardens the checker itself), add an `EVIDENCE-OVERRIDE: <reason>` line to the
# PR body — it is recorded as a logged manual override.
#
# ALWAYS-ON for PRs to main: the gate decides *in-job* whether evidence is
# required from a trusted base checkout, so it can be a REQUIRED check without
# ever parking a PR on a `Pending` status — a trigger-level path filter would
# skip the check, and a required-but-skipped check never reports, deadlocking
# merge. The scope set also covers the gate's own source files, so a PR that
# weakens the gate is itself gated.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-evidence-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  evidence:
    name: PR Evidence Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scope evidence and verify (live, tied to head SHA)
        # PR body / head SHA are passed via env, never interpolated into the
        # shell, to avoid script injection from untrusted PR content.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull_request.changed_files value: ${PR_CHANGED_FILES}"
            exit 1
          fi
          if [ "$PR_CHANGED_FILES" -gt 3000 ]; then
            echo "::error::PR changed_files=${PR_CHANGED_FILES} exceeds the GitHub pull request files API cap of 3000; failing closed instead of scoping from an incomplete file list."
            exit 1
          fi
          # Paginated files API: the non-paginated changed-files listing
          # truncates large PRs and could let a sensitive file slip past this
          # self-protecting gate.
          CHANGED="$(gh api --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')"
          FILE_COUNT="$(printf '%s\n' "$CHANGED" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$FILE_COUNT" -ne "$PR_CHANGED_FILES" ]; then
            echo "::error::GitHub files API returned ${FILE_COUNT} paths but the PR reports ${PR_CHANGED_FILES} changed files; failing closed."
            exit 1
          fi
          echo "Changed files:"
          echo "$CHANGED"
          detect_required_from_inline_scope() {
            local path
            while IFS= read -r path; do
              case "$path" in
                workflows/pipeline.py|workflows/run_manager.py|storage/*|tests/fixtures/thesis_llm_golden_set*|scripts/check_pr_evidence.py|scripts/ci/detect_evidence_scope.py|.github/workflows/pr-evidence.yml|tests/ci/test_pr_evidence_workflow.py|tests/ci/test_detect_evidence_scope.py|tests/scripts/test_check_pr_evidence.py)
                  echo "true"
                  return
                  ;;
              esac
            done <<< "$CHANGED"
            echo "false"
          }
          # Run scope/checker code from the trusted base checkout. This PR
          # bootstraps the scope helper, so retain an inline matcher until the
          # helper exists on the protected base ref.
          if [ -f scripts/ci/detect_evidence_scope.py ]; then
            REQUIRED="$(python -m scripts.ci.detect_evidence_scope --changed-files "$CHANGED")"
          else
            REQUIRED="$(detect_required_from_inline_scope)"
          fi
          if [ "$REQUIRED" != "true" ] && [ "$REQUIRED" != "false" ]; then
            echo "::error::Evidence scope detection returned unexpected value: ${REQUIRED}"
            exit 1
          fi
          if [ "$REQUIRED" = "true" ]; then
            echo "PR Evidence Gate: evidence required for changed paths"
            python scripts/check_pr_evidence.py \
              --body "$PR_BODY" \
              --live \
              --head-sha "$PR_HEAD_SHA"
          else
            echo "PR Evidence Gate: evidence not required for changed paths"
            exit 0
          fi
