name: Litestream Restore Verify Nightly

on:
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-verify:
    name: Litestream Restore Verify Nightly
    runs-on: ubuntu-latest
    environment: sqlite-production-backups
    env:
      LITESTREAM_VERSION: "0.5.2"
      SQLITE_BACKUP_BUCKET: ${{ secrets.SQLITE_BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
      # 6A: no inline fallback - an unset variable must fail the settings guard
      SQLITE_RESTORE_MIN_SIGNALS: ${{ vars.SQLITE_RESTORE_MIN_SIGNALS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Litestream
        shell: bash
        run: |
          curl -sSfL \
            "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz" \
            -o /tmp/litestream.tar.gz
          tar -xzf /tmp/litestream.tar.gz -C /tmp
          sudo install /tmp/litestream /usr/local/bin/litestream
          litestream version

      - name: Resolve current schema version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import ast
          from pathlib import Path

          source = Path("storage/signal_store.py").read_text(encoding="utf-8")
          module = ast.parse(source)
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "CURRENT_SCHEMA_VERSION":
                          print(f"CURRENT_SCHEMA_VERSION={ast.literal_eval(node.value)}")
                          raise SystemExit(0)
          raise SystemExit("CURRENT_SCHEMA_VERSION not found")
          PY

      - name: Verify required backup settings
        shell: bash
        run: |
          test -n "$SQLITE_BACKUP_BUCKET"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$SQLITE_RESTORE_MIN_SIGNALS"

      - name: Restore replica into temp DB and verify
        shell: bash
        run: |
          mkdir -p artifacts/litestream-restore-verify
          python -m scripts.litestream_restore_verify \
            --replica-url "s3://${SQLITE_BACKUP_BUCKET}/sweetswwetharmony/litestream/signals.db/" \
            --restore-path "$RUNNER_TEMP/restored-signals.db" \
            --min-signals "$SQLITE_RESTORE_MIN_SIGNALS" \
            --expected-schema-version "$CURRENT_SCHEMA_VERSION" \
            --summary-out artifacts/litestream-restore-verify/summary.json

      - name: Upload restore summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litestream-restore-verify-summary
          path: artifacts/litestream-restore-verify/
          if-no-files-found: warn

  close-failure-tracker:
    name: Close Failure Tracker on Recovery
    runs-on: ubuntu-latest
    needs: restore-verify
    if: success()
    permissions:
      contents: read
      issues: write
    steps:
      # local composite actions cannot be resolved without a checkout
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Close failure tracking issue with green-run link
        uses: ./.github/actions/failure-issue
        with:
          mode: close
          title: 'Litestream Restore Verify: nightly verification failed'
          label: litestream-verify-failure
          workflow-name: ${{ github.workflow }}
          body: |
            ## Recovered

            The nightly cloud-restore verification succeeded. Auto-closing
            this failure tracker; the link below is the first green run
            after the tracked failure(s).

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: restore-verify
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      # local composite actions cannot be resolved without a checkout
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Open or update failure tracking issue
        uses: ./.github/actions/failure-issue
        with:
          title: 'Litestream Restore Verify: nightly verification failed'
          label: litestream-verify-failure
          workflow-name: ${{ github.workflow }}
          body: |
            ## Litestream Restore Verify Failure

            The nightly cloud-restore verification failed. The S3/R2 replica
            may not be restorable, may be stale, or the required backup
            settings are missing - treat this as a durability incident until
            proven otherwise.

            ### Actions Required
            1. Open the failed run below and inspect the restore-verify job logs
            2. Check the required-settings guard (bucket, AWS credentials, SQLITE_RESTORE_MIN_SIGNALS)
            3. Verify the replica with a manual restore before trusting backups again
