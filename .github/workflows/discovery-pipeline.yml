name: Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      collectors:
        description: Comma-separated list of collectors to run
        required: false
        default: github,hacker_news,sec_edgar,domain_whois,product_hunt
      dry_run:
        description: Run in dry-run mode
        type: boolean
        required: false
        default: false
      skip_monitoring:
        description: Skip portfolio monitoring
        type: boolean
        required: false
        default: false
      skip_discovery:
        description: Skip discovery collection
        type: boolean
        required: false
        default: false
      recover_legacy_artifact:
        description: One-time operator-approved migration for a DB-only legacy artifact
        type: boolean
        required: false
        default: false
      bootstrap_from_replica:
        description: >-
          Operator-approved bootstrap: when no signals-db-latest artifact
          exists, restore signals.db from the Litestream S3 replica
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  DEFAULT_COLLECTORS: github,hacker_news,sec_edgar,domain_whois,product_hunt

jobs:
  run-pipeline:
    name: Run Pipeline
    runs-on: ubuntu-latest
    # T2-A: backup secrets are provisioned environment-scoped (same environment
    # the nightly litestream-restore-verify already uses); secret names unchanged
    environment: sqlite-production-backups
    env:
      SQLITE_BACKUP_BUCKET: ${{ secrets.SQLITE_BACKUP_BUCKET }}   # empty string when unset — safe
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx aiosqlite pydantic numpy aiohttp
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Litestream
        if: env.SQLITE_BACKUP_BUCKET != ''
        shell: bash
        run: |
          LITESTREAM_VERSION=0.5.2
          curl -sSfL \
            "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz" \
            -o /tmp/litestream.tar.gz
          tar -xzf /tmp/litestream.tar.gz -C /tmp
          sudo install /tmp/litestream /usr/local/bin/litestream
          litestream version

      - name: Resolve out-of-tree database path
        run: |
          # #149: operate the canonical signals DB outside the git working tree so
          # a checkout/restore can never clobber it, and the in-tree guard
          # (storage/db_paths.py) is satisfied. Set once here; every later step
          # (including ones without an explicit env:) inherits it via $GITHUB_ENV.
          echo "DISCOVERY_DB_PATH=$RUNNER_TEMP/signals.db" >> "$GITHUB_ENV"

      - name: Restore persistent database state
        id: restore-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "downloaded=false" >> "$GITHUB_OUTPUT"
          echo "restored_db=false" >> "$GITHUB_OUTPUT"
          echo "restored_watermark=false" >> "$GITHUB_OUTPUT"

          echo "Attempting to restore database state from previous run..."
          rm -rf artifact-tmp
          if gh run download --name signals-db-latest -D ./artifact-tmp 2>/dev/null; then
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            if [ -f artifact-tmp/signals.db ]; then
              mv artifact-tmp/signals.db "$DISCOVERY_DB_PATH"
              echo "restored_db=true" >> "$GITHUB_OUTPUT"
              echo "Restored signals.db from artifact"
            fi
            if [ -f artifact-tmp/.omx/state/db_watermark.json ]; then
              mkdir -p .omx/state
              cp artifact-tmp/.omx/state/db_watermark.json .omx/state/db_watermark.json
              echo "restored_watermark=true" >> "$GITHUB_OUTPUT"
              echo "Restored DB guard watermark from artifact"
            fi
            rm -rf artifact-tmp
          else
            echo "No complete database artifact found"
          fi

      # 3A: operator-approved bootstrap when no signals-db-latest artifact
      # survived (e.g. retention lapsed). Restores from the SAME replica URL
      # the replicate step publishes to, then hands the DB to the unchanged
      # integrity + anomaly gates below. Fail closed on missing bucket,
      # failed restore, or failed integrity check.
      - name: Bootstrap database from Litestream replica
        id: bootstrap-replica
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.bootstrap_from_replica == 'true' &&
          steps.restore-state.outputs.restored_db != 'true'
        run: |
          echo "bootstrapped=false" >> "$GITHUB_OUTPUT"

          if [ -z "$SQLITE_BACKUP_BUCKET" ]; then
            echo "::error::bootstrap_from_replica requires SQLITE_BACKUP_BUCKET to be configured"
            exit 1
          fi

          REPLICA_URL="s3://${SQLITE_BACKUP_BUCKET}/sweetswwetharmony/litestream/signals.db/"
          echo "::warning::Bootstrapping signals.db from the Litestream replica under explicit operator approval"
          echo "Restoring $REPLICA_URL to $DISCOVERY_DB_PATH"
          litestream restore -o "$DISCOVERY_DB_PATH" "$REPLICA_URL"

          if [ ! -f "$DISCOVERY_DB_PATH" ]; then
            echo "::error::Litestream restore did not produce a database file"
            exit 1
          fi

          echo "Validating database integrity of bootstrapped replica..."
          if ! sqlite3 "$DISCOVERY_DB_PATH" "PRAGMA integrity_check;" | grep -q "^ok$"; then
            echo "::error::Bootstrapped signals.db failed integrity check"
            exit 1
          fi

          echo "Initializing DB guard watermark for bootstrapped database..."
          python run_pipeline.py init-watermark --db-path "$DISCOVERY_DB_PATH"

          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          echo "Replica bootstrap complete; proceeding through the standard gates"

      - name: Validate restored database state
        id: validate-restore
        env:
          RESTORED_DB: ${{ steps.restore-state.outputs.restored_db }}
          RESTORED_WATERMARK: ${{ steps.restore-state.outputs.restored_watermark }}
          RECOVER_LEGACY_ARTIFACT: ${{ github.event.inputs.recover_legacy_artifact || 'false' }}
          BOOTSTRAPPED_DB: ${{ steps.bootstrap-replica.outputs.bootstrapped || 'false' }}
        run: |
          echo "restore_accepted=false" >> "$GITHUB_OUTPUT"
          echo "legacy_watermark_migrated=false" >> "$GITHUB_OUTPUT"

          if [ "$RESTORED_DB" != "true" ] && [ "$BOOTSTRAPPED_DB" != "true" ]; then
            echo "::error::Daily Pipeline requires paired restore of signals.db and .omx/state/db_watermark.json"
            echo "Restored signals.db: $RESTORED_DB"
            echo "Restored watermark: $RESTORED_WATERMARK"
            echo "If the artifact expired, manually dispatch with bootstrap_from_replica=true to restore from the Litestream replica."
            exit 1
          fi

          if [ ! -f "$DISCOVERY_DB_PATH" ]; then
            echo "::error::Restored signals.db is missing after artifact unpack"
            exit 1
          fi

          echo "Validating database integrity..."
          if ! sqlite3 "$DISCOVERY_DB_PATH" "PRAGMA integrity_check;" | grep -q "^ok$"; then
            echo "::error::Restored signals.db failed integrity check"
            exit 1
          fi

          if [ "$RESTORED_WATERMARK" != "true" ] && [ "$BOOTSTRAPPED_DB" != "true" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$RECOVER_LEGACY_ARTIFACT" != "true" ]; then
              echo "::error::Daily Pipeline requires paired restore of signals.db and .omx/state/db_watermark.json"
              echo "Restored signals.db: $RESTORED_DB"
              echo "Restored watermark: $RESTORED_WATERMARK"
              echo "For a one-time legacy artifact migration, manually dispatch with recover_legacy_artifact=true."
              exit 1
            fi
            echo "::warning::Recovering DB guard watermark from a legacy DB-only artifact under explicit operator approval"
            python run_pipeline.py init-watermark --db-path "$DISCOVERY_DB_PATH"
            echo "legacy_watermark_migrated=true" >> "$GITHUB_OUTPUT"
          fi

          if [ ! -f .omx/state/db_watermark.json ]; then
            echo "::error::Restored database state is incomplete after artifact unpack"
            exit 1
          fi

          echo "Validating DB guard watermark JSON..."
          python -m json.tool .omx/state/db_watermark.json >/dev/null

          echo "restore_accepted=true" >> "$GITHUB_OUTPUT"
          echo "Database state restore accepted"

      - name: Anomaly check on restored database
        id: anomaly-check
        if: ${{ steps.validate-restore.outputs.restore_accepted == 'true' }}
        run: |
          python scripts/db_anomaly.py "$DISCOVERY_DB_PATH" \
            --known-bad-shas scripts/known_bad_shas.json \
            --watermark .omx/state/db_watermark.json \
            --output "$RUNNER_TEMP/anomaly_manifest.json"
          echo "Anomaly check passed"

      - name: Sync portfolio companies
        if: ${{ github.event.inputs.skip_monitoring != 'true' }}
        run: |
          echo "Syncing portfolio companies..."
          python run_pipeline.py monitor sync-portfolio || echo "Portfolio sync completed with warnings"

      - name: Run portfolio monitoring
        if: ${{ github.event.inputs.skip_monitoring != 'true' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Running portfolio monitoring..."
          python run_pipeline.py monitor run --only-portfolio --limit 100 --no-embeddings || true

      - name: Dispatch monitoring alerts to Slack
        if: ${{ github.event.inputs.skip_monitoring != 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Dispatching monitoring alerts..."
          python run_pipeline.py monitor dispatch \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Dispatch completed (no webhook configured or no alerts)"

      - name: Sync suppression cache from Notion
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "Syncing suppression cache..."
          python run_pipeline.py sync || echo "Suppression sync completed with warnings"

      - name: Run discovery collectors
        if: ${{ github.event.inputs.skip_discovery != 'true' }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PH_API_KEY: ${{ secrets.PH_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          COLLECTORS="${{ github.event.inputs.collectors || env.DEFAULT_COLLECTORS }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "Running collectors: $COLLECTORS"
          if [ "$DRY_RUN" = "true" ]; then
            python run_pipeline.py full --collectors "$COLLECTORS" --dry-run
          else
            python run_pipeline.py full --collectors "$COLLECTORS"
          fi

      - name: Show pipeline stats
        run: |
          echo "=== Pipeline Stats ==="
          python run_pipeline.py stats || true
          echo ""
          echo "=== Monitoring Status ==="
          python run_pipeline.py monitor status || true

      - name: Finalize database
        id: finalize-db
        if: always()
        run: |
          echo "publish_artifacts=false" >> "$GITHUB_OUTPUT"
          echo "Finalizing database..."
          if [ "${{ steps.anomaly-check.outcome }}" != "success" ]; then
            echo "Restore/anomaly gate was not accepted; skipping artifact publication"
            exit 0
          fi
          if [ -f "$DISCOVERY_DB_PATH" ]; then
            if [ -f "$DISCOVERY_DB_PATH-wal" ]; then
              echo "Checkpointing WAL..."
              sqlite3 "$DISCOVERY_DB_PATH" "PRAGMA wal_checkpoint(TRUNCATE);" || true
            fi
            echo "Final integrity check..."
            sqlite3 "$DISCOVERY_DB_PATH" "PRAGMA integrity_check;" | grep -q "^ok$"
            if [ ! -f .omx/state/db_watermark.json ]; then
              echo "::error::DB guard watermark missing at finalization"
              exit 1
            fi
            python -m json.tool .omx/state/db_watermark.json >/dev/null
            # Stage artifact contents out-of-tree so signals.db never lands in the
            # workspace; preserve the layout the restore step expects
            # (signals.db + .omx/state/db_watermark.json at the artifact root).
            STAGING="$RUNNER_TEMP/artifact-out"
            rm -rf "$STAGING"
            mkdir -p "$STAGING/.omx/state"
            cp "$DISCOVERY_DB_PATH" "$STAGING/signals.db"
            [ -f "$DISCOVERY_DB_PATH-wal" ] && cp "$DISCOVERY_DB_PATH-wal" "$STAGING/signals.db-wal" || true
            [ -f "$DISCOVERY_DB_PATH-shm" ] && cp "$DISCOVERY_DB_PATH-shm" "$STAGING/signals.db-shm" || true
            cp .omx/state/db_watermark.json "$STAGING/.omx/state/db_watermark.json"
            ls -lh "$STAGING"/signals.db*
            echo "publish_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No database file to finalize"
            exit 1
          fi

      - name: Upload signals database artifact
        if: ${{ always() && steps.finalize-db.outputs.publish_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signals-db-latest
          path: |
            ${{ runner.temp }}/artifact-out/signals.db
            ${{ runner.temp }}/artifact-out/signals.db-wal
            ${{ runner.temp }}/artifact-out/signals.db-shm
            ${{ runner.temp }}/artifact-out/.omx/state/db_watermark.json
          # 1A: the recovery artifact must survive extended pipeline outages
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload timestamped database artifact
        if: ${{ success() && steps.finalize-db.outputs.publish_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signals-db-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/artifact-out/signals.db
            ${{ runner.temp }}/artifact-out/.omx/state/db_watermark.json
          retention-days: 7
          include-hidden-files: true

      - name: Replicate database to S3 via Litestream
        if: >-
          success() &&
          env.SQLITE_BACKUP_BUCKET != ''
        continue-on-error: true
        shell: bash
        run: |
          DB_PATH="$DISCOVERY_DB_PATH"
          REPLICA_URL="s3://${SQLITE_BACKUP_BUCKET}/sweetswwetharmony/litestream/signals.db/"

          echo "Replicating $DB_PATH to $REPLICA_URL"

          # Checkpoint WAL before replication
          if [ -f "${DB_PATH}-wal" ]; then
            sqlite3 "$DB_PATH" "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi

          # One-shot replication: replicate -exec runs the binary, syncs, then exits cleanly
          litestream replicate -exec "echo replicated" \
            "$DB_PATH" "$REPLICA_URL" 2>&1 | tail -20

          echo "Litestream replication complete"

  close-failure-tracker:
    name: Close Failure Tracker on Recovery
    runs-on: ubuntu-latest
    needs: run-pipeline
    if: success()
    permissions:
      contents: read
      issues: write
    steps:
      # local composite actions cannot be resolved without a checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Close failure tracking issue with green-run link
        uses: ./.github/actions/failure-issue
        with:
          mode: close
          title: 'Daily Pipeline: run failed'
          label: daily-pipeline-failure
          workflow-name: ${{ github.workflow }}
          body: |
            ## Recovered

            The Daily Pipeline completed successfully. Auto-closing this
            failure tracker; the link below is the first green run after
            the tracked failure(s).

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: run-pipeline
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      # local composite actions cannot be resolved without a checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Open or update failure tracking issue
        uses: ./.github/actions/failure-issue
        with:
          title: 'Daily Pipeline: run failed'
          label: daily-pipeline-failure
          workflow-name: ${{ github.workflow }}
          body: |
            ## Daily Pipeline Failure

            The Daily Pipeline run failed.

            | Field | Value |
            |-------|-------|
            | Run | #${{ github.run_number }} |
            | Trigger | ${{ github.event_name }} |

            ### Actions Required
            1. Open the failed run below and inspect the run-pipeline job logs
            2. Check the restore/validation/anomaly gates first, then collector steps
            3. Re-run the workflow once the underlying issue is fixed

      # best-effort secondary channel; self-skips when the webhook is missing
      - name: Send Slack failure notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "Daily Pipeline Failed",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {"type": "mrkdwn", "text": "*Run:* #${{ github.run_number }}"},
                      {"type": "mrkdwn", "text": "*Trigger:* ${{ github.event_name }}"}
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {"type": "plain_text", "text": "View Logs"},
                        "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }
                    ]
                  }
                ],
                "text": "Daily Pipeline Failed - Run #${{ github.run_number }}"
              }' \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL not configured, skipping notification"
          fi
