name: Daily Website Monitoring

on:
  schedule:
    # Run daily at 8:00 AM UTC (after signal collection)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum watches to check'
        required: false
        default: '100'
      no_embeddings:
        description: 'Disable semantic drift detection'
        type: boolean
        required: false
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  monitor-websites:
    name: Monitor Websites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx aiosqlite pydantic numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download signals database
        uses: actions/download-artifact@v4
        with:
          name: signals-db-synced-${{ github.run_number }}
          path: .
        continue-on-error: true  # OK if no artifact exists yet

      - name: Run website monitoring
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCOVERY_DB_PATH: signals.db
        run: |
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          NO_EMB="${{ github.event.inputs.no_embeddings || 'false' }}"

          if [ "$NO_EMB" = "true" ]; then
            python run_pipeline.py monitor run --limit "$LIMIT" --no-embeddings -v
          else
            python run_pipeline.py monitor run --limit "$LIMIT" -v
          fi

      - name: Show monitoring status
        run: |
          python run_pipeline.py monitor status

      - name: Upload signals database artifact
        uses: actions/upload-artifact@v4
        with:
          name: signals-db-monitored-${{ github.run_number }}
          path: signals.db
          retention-days: 30

  drain-outbox:
    name: Drain Outbox
    runs-on: ubuntu-latest
    needs: monitor-websites

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx aiosqlite pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download signals database
        uses: actions/download-artifact@v4
        with:
          name: signals-db-monitored-${{ github.run_number }}
          path: .

      - name: Drain outbox queue
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCOVERY_DB_PATH: signals.db
        run: |
          python run_pipeline.py outbox drain -v

      - name: Upload final database
        uses: actions/upload-artifact@v4
        with:
          name: signals-db-final-${{ github.run_number }}
          path: signals.db
          retention-days: 30

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [monitor-websites, drain-outbox]
    if: failure()

    steps:
      - name: Send Slack failure notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Monitoring Failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Run:* #${{ github.run_number }}"},
                    {"type": "mrkdwn", "text": "*Trigger:* ${{ github.event_name }}"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Logs"},
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ],
              "text": "Daily Website Monitoring Failed - Run #${{ github.run_number }}"
            }' \
            "$SLACK_WEBHOOK_URL"
