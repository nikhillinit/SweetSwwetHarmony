name: Daily Pipeline

on:
  schedule:
    # Run daily at 6:00 AM UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      collectors:
        description: 'Comma-separated list of collectors to run'
        required: false
        default: 'github,hacker_news,sec_edgar,domain_whois,product_hunt'
      dry_run:
        description: 'Run in dry-run mode (no Notion push)'
        type: boolean
        required: false
        default: false
      skip_monitoring:
        description: 'Skip portfolio monitoring'
        type: boolean
        required: false
        default: false
      skip_discovery:
        description: 'Skip discovery collection'
        type: boolean
        required: false
        default: false

# Prevent concurrent runs to avoid DB conflicts
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  DEFAULT_COLLECTORS: 'github,hacker_news,sec_edgar,domain_whois,product_hunt'

jobs:
  # Single unified job for all pipeline steps
  run-pipeline:
    name: Daily Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx aiosqlite pydantic numpy aiohttp
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # === STEP 1: Restore DB Artifact ===
      - name: Restore signals database from latest successful run
        id: restore-db
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to download most recent signals-db artifact
          echo "Attempting to restore database from previous run..."
          if gh run download --name signals-db-latest -D ./artifact-tmp 2>/dev/null; then
            if [ -f artifact-tmp/signals.db ]; then
              mv artifact-tmp/signals.db signals.db
              echo "restored=true" >> $GITHUB_OUTPUT
              echo "Restored signals.db from artifact"
            fi
            rm -rf artifact-tmp
          else
            echo "restored=false" >> $GITHUB_OUTPUT
            echo "No artifact found, will initialize fresh database"
          fi

      # === STEP 2: Validate DB Integrity ===
      - name: Validate or initialize database
        env:
          DISCOVERY_DB_PATH: signals.db
        run: |
          if [ -f signals.db ]; then
            echo "Validating database integrity..."
            if sqlite3 signals.db "PRAGMA integrity_check;" | grep -q "^ok$"; then
              echo "Database integrity check passed"
            else
              echo "Database corrupted, reinitializing..."
              rm -f signals.db signals.db-wal signals.db-shm
            fi
          fi

          # Initialize if DB doesn't exist or was removed
          if [ ! -f signals.db ]; then
            echo "Initializing fresh database..."
            python -c "
          import asyncio
          from storage.signal_store import SignalStore
          async def init():
              store = SignalStore('signals.db')
              await store.initialize()
              await store.close()
              print('Database initialized')
          asyncio.run(init())
          "
          fi

      # === STEP 3: Portfolio Sync ===
      - name: Sync portfolio companies
        if: ${{ github.event.inputs.skip_monitoring != 'true' }}
        env:
          DISCOVERY_DB_PATH: signals.db
        run: |
          echo "Syncing portfolio companies..."
          python run_pipeline.py monitor sync-portfolio -v || echo "Portfolio sync completed with warnings"

      # === STEP 4: Portfolio Monitoring ===
      - name: Run portfolio monitoring
        if: ${{ github.event.inputs.skip_monitoring != 'true' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCOVERY_DB_PATH: signals.db
        run: |
          echo "Running portfolio monitoring..."
          python run_pipeline.py monitor run --only-portfolio --limit 100 --no-embeddings -v || true

      # === STEP 5: Slack Dispatch ===
      - name: Dispatch monitoring alerts to Slack
        if: ${{ github.event.inputs.skip_monitoring != 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCOVERY_DB_PATH: signals.db
        run: |
          echo "Dispatching monitoring alerts..."
          python run_pipeline.py monitor dispatch \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Dispatch completed (no webhook configured or no alerts)"

      # === STEP 6: Suppression Sync ===
      - name: Sync suppression cache from Notion
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DISCOVERY_DB_PATH: signals.db
        run: |
          echo "Syncing suppression cache..."
          python run_pipeline.py sync -v || echo "Suppression sync completed with warnings"

      # === STEP 7: Discovery Collection ===
      - name: Run discovery collectors
        if: ${{ github.event.inputs.skip_discovery != 'true' }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PH_API_KEY: ${{ secrets.PH_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCOVERY_DB_PATH: signals.db
        run: |
          COLLECTORS="${{ github.event.inputs.collectors || env.DEFAULT_COLLECTORS }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "Running collectors: $COLLECTORS"

          if [ "$DRY_RUN" = "true" ]; then
            python run_pipeline.py full --collectors "$COLLECTORS" --dry-run -v
          else
            python run_pipeline.py full --collectors "$COLLECTORS" -v
          fi

      # === STEP 8: Show stats ===
      - name: Show pipeline stats
        run: |
          echo "=== Pipeline Stats ==="
          python run_pipeline.py stats || true
          echo ""
          echo "=== Monitoring Status ==="
          python run_pipeline.py monitor status || true

      # === STEP 9: Database Finalization (always runs) ===
      - name: Finalize database
        if: always()
        run: |
          echo "Finalizing database..."
          if [ -f signals.db ]; then
            # Checkpoint WAL if present
            if [ -f signals.db-wal ]; then
              echo "Checkpointing WAL..."
              sqlite3 signals.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
            fi

            # Final integrity check
            echo "Final integrity check..."
            sqlite3 signals.db "PRAGMA integrity_check;" || echo "Integrity check skipped"

            # Show DB size
            ls -lh signals.db*
          else
            echo "No database file to finalize"
          fi

      # === STEP 10: Upload Artifact (always runs) ===
      - name: Upload signals database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-db-latest
          path: |
            signals.db
            signals.db-wal
            signals.db-shm
          retention-days: 30
          if-no-files-found: warn

      # === STEP 11: Upload timestamped artifact for history ===
      - name: Upload timestamped database artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signals-db-${{ github.run_number }}
          path: signals.db
          retention-days: 7

  # Failure notification job
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: run-pipeline
    if: failure()

    steps:
      - name: Send Slack failure notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Daily Pipeline Failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Run:* #${{ github.run_number }}"},
                    {"type": "mrkdwn", "text": "*Trigger:* ${{ github.event_name }}"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Logs"},
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ],
              "text": "Daily Pipeline Failed - Run #${{ github.run_number }}"
            }' \
            "$SLACK_WEBHOOK_URL"
