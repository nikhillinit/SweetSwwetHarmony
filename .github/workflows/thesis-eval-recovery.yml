name: Thesis Evaluation Recovery

on:
  workflow_run:
    workflows: [Thesis Classification Evaluation]
    types: [completed]

permissions:
  contents: read

jobs:
  close-failure-trackers:
    name: Close Thesis Failure Trackers on Scheduled Recovery
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      # workflow_run can carry a write token, so execute only the trusted action
      # from the repository's default branch, never code from the source run.
      - name: Checkout trusted recovery action
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Close low-accuracy alert with source green-run link
        uses: ./.github/actions/failure-issue
        with:
          mode: close
          title: 'Thesis Evaluation: Accuracy below threshold'
          label: thesis-eval-alert
          workflow-name: ${{ github.event.workflow_run.name }}
          recovery-run-id: ${{ github.event.workflow_run.id }}
          body: |
            ## Recovered

            The scheduled thesis evaluation completed with accuracy at or
            above threshold. Auto-closing this alert; the link below is the
            first canonical green run after the tracked failure(s).

      - name: Close infrastructure failure with source green-run link
        uses: ./.github/actions/failure-issue
        with:
          mode: close
          title: 'Thesis Evaluation: infrastructure failure'
          label: thesis-eval-infra
          workflow-name: ${{ github.event.workflow_run.name }}
          recovery-run-id: ${{ github.event.workflow_run.id }}
          body: |
            ## Recovered

            The scheduled thesis evaluation completed successfully.
            Auto-closing this infrastructure-failure tracker; the link below
            is the first canonical green run after the tracked failure(s).
