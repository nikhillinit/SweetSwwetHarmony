name: Regression Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  # Focused cross-platform process-boundary suite. Owned-process lifetime and
  # whole-tree reaping must hold on BOTH OSes: the POSIX owned-group / failed-exec
  # tests only execute on Ubuntu, the Windows taskkill tree reap only on Windows.
  PROCESS_BOUNDARY_SUITE: >-
    tests/ops/test_process_runtime.py
    tests/ops/test_process_establishment_race_gate0a.py
    tests/ops/test_execution_provenance.py
    tests/ops/test_provider_environment.py
    tests/ops/test_wrapper_execution_envelope.py
    tests/ops/test_wrapper_boundary_parity.py
    tests/ops/test_codex_wrapper_timeout.py
    tests/ops/test_codex_wrapper.py
    tests/ops/hermes/test_kimi_cli_provider.py
    tests/ops/hermes/test_gemini_provider.py
    tests/ops/hermes/test_agy_flag_contract.py
    tests/ops/hermes/test_missing_binary_contract.py

jobs:
  ubuntu-regression:
    name: Ubuntu Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (catch SyntaxErrors early)
        run: |
          python -m compileall -q \
            api collectors connectors consumer dashboard \
            discovery_engine distribution enrichment importers \
            integrations intelligence monitoring ops profilers \
            scripts services storage utils verification \
            visualization workflows

      - name: Smoke imports
        run: python scripts/ci_smoke_imports.py

      - name: Identity pattern lint
        run: python scripts/lint_identity_patterns.py --check --baseline scripts/identity_lint_baseline.json --root .

      - name: CLI-exclusive LLM generation guard
        run: |
          python -m pytest tests/ci/test_cli_exclusive_generation.py \
            --tb=short -q

      - name: Schema version fast-fail
        run: |
          python -m pytest tests/storage/test_schema_version_parity.py \
            tests/api/test_health_schema_version.py \
            --tb=short -q

      - name: Process-boundary suite (POSIX owned-group + whole-tree reap)
        run: |
          python -m pytest ${{ env.PROCESS_BOUNDARY_SUITE }} \
            --tb=short -q

      - name: Run regression suite
        env:
          DELIVERY_MODE: staging_only
        run: |
          python -m pytest tests/api/ tests/integration/ \
            tests/workflows/test_batch_publisher.py \
            --tb=short -q

      - name: Schema invariants
        env:
          DELIVERY_MODE: staging_only
        run: |
          python -m pytest tests/ops/test_schema_invariants.py \
            --tb=short -q

      - name: UTF-8 docs guard
        run: python scripts/ci/check_docs_utf8.py

      - name: v6.6.2 help contract
        run: |
          python -m pytest tests/cli/test_v662_help_contract.py \
            --tb=short -q

  windows-runtime-boundary:
    name: Windows Runtime Boundary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install focused dependencies
        # The process-boundary suite only imports the test runner plus the two
        # libraries the wrappers/config pull (pydantic, python-dotenv).
        # Deliberately NOT `-r requirements.txt`: that stack builds nmslib (via
        # scispacy) from source on windows-latest and is unrelated to this
        # suite. Keep the lower bounds in sync with requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.4.0" "pytest-asyncio>=0.21.0" "pydantic>=2.0.0" "python-dotenv>=1.0.0"

      - name: Process-boundary suite (Windows taskkill whole-tree reap)
        run: python -m pytest ${{ env.PROCESS_BOUNDARY_SUITE }} --tb=short -q

  # Fail-closed aggregator. The branch-protection required check is this job's
  # name ("Core Regression Suite"); it stays stable while the underlying work is
  # split across OS-specific jobs. `if: always()` means it runs even when a
  # dependency fails, and it explicitly re-asserts that BOTH dependencies
  # succeeded -- a skipped or failed dependency fails the gate.
  regression:
    name: Core Regression Suite
    runs-on: ubuntu-latest
    needs: [ubuntu-regression, windows-runtime-boundary]
    if: always()
    steps:
      - name: Require all boundary jobs to succeed
        run: |
          ubuntu='${{ needs.ubuntu-regression.result }}'
          windows='${{ needs.windows-runtime-boundary.result }}'
          echo "ubuntu-regression=$ubuntu"
          echo "windows-runtime-boundary=$windows"
          if [ "$ubuntu" != "success" ] || [ "$windows" != "success" ]; then
            echo "::error::Core Regression Suite failing: a required OS boundary job did not succeed"
            exit 1
          fi
          echo "All boundary jobs succeeded"

  docker-build:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t harmonic:${{ github.sha }} .

      - name: Smoke import governance modules in image
        run: |
          docker run --rm --entrypoint python harmonic:${{ github.sha }} -c \
            "import governance.contracts; import api.routers.governance"

      - name: Start container
        run: |
          uid=$(docker run --rm --entrypoint id harmonic:${{ github.sha }} -u harmonic)
          gid=$(docker run --rm --entrypoint id harmonic:${{ github.sha }} -g harmonic)
          docker run -d --name harmonic-ci -p 8000:8000 \
            --tmpfs /tmp/harmonic:rw,mode=0775,uid=${uid},gid=${gid} \
            -e DISCOVERY_DB_PATH=/tmp/harmonic/signals.db \
            -e DELIVERY_MODE=staging_only \
            -e STRICT_CONFIG_VALIDATION=false \
            harmonic:${{ github.sha }}

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy within 60s"
          docker logs harmonic-ci
          exit 1

      - name: Debug container on failure
        if: failure()
        run: |
          docker ps -a || true
          docker exec harmonic-ci sh -c "id; ls -ld /app /tmp/harmonic || true" || true
          docker logs harmonic-ci || true

      - name: Stop container
        if: always()
        run: docker stop harmonic-ci || true
