name: Regression Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  regression:
    name: Core Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression suite
        env:
          DELIVERY_MODE: staging_only
        run: |
          python -m pytest tests/api/ tests/integration/ \
            tests/workflows/test_batch_publisher.py \
            --tb=short -q

  docker-build:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t harmonic:${{ github.sha }} .

      - name: Prepare data directory
        run: mkdir -p ${{ runner.temp }}/harmonic-data

      - name: Start container
        run: |
          docker run -d --name harmonic-ci -p 8000:8000 \
            -v ${{ runner.temp }}/harmonic-data:/app/data \
            -e DISCOVERY_DB_PATH=/app/data/signals.db \
            -e DELIVERY_MODE=staging_only \
            -e STRICT_CONFIG_VALIDATION=false \
            harmonic:${{ github.sha }}

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy within 30s"
          docker logs harmonic-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop harmonic-ci || true
