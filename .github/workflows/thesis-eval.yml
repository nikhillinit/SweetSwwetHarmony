name: Thesis Classification Evaluation

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to evaluate'
        required: false
        default: 'google/gemini-3.5-flash'
        type: choice
        options:
          - google/gemini-1.5-flash
          - google/gemini-1.5-pro
          - google/gemini-3.5-flash
          - openai/gpt-4o-mini
          - openai/gpt-4o
      solver:
        description: 'Solver variant to use'
        required: false
        default: 'thesis_with_cot'
        type: choice
        options:
          - thesis_classification
          - thesis_with_cot
          - thesis_with_self_critique
          - thesis_verbose_cot

env:
  PYTHON_VERSION: '3.11'
  ACCURACY_THRESHOLD: 0.75

jobs:
  evaluate:
    name: Run Thesis Evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      accuracy: ${{ steps.parse-results.outputs.accuracy }}
      low_accuracy: ${{ steps.check-threshold.outputs.low_accuracy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install inspect-ai inspect-flow

      - name: Check dataset exists
        id: check-dataset
        run: |
          if [ -f "datasets/thesis_ground_truth.jsonl" ]; then
            echo "dataset_exists=true" >> "$GITHUB_OUTPUT"
            echo "Dataset found"
          else
            echo "dataset_exists=false" >> "$GITHUB_OUTPUT"
            echo "Dataset not found - will use sample data"
          fi

      - name: Run evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-3.5-flash' }}"
          if [ "${{ steps.check-dataset.outputs.dataset_exists }}" = "true" ]; then
            TASK="${{ github.event.inputs.solver || 'thesis_with_cot' }}"
          else
            TASK="thesis_sample_data"
          fi
          echo "Running evaluation with model=$MODEL, task=$TASK"
          # inspect_ai resolves task selectors as <file>@<task> (split_spec
          # rsplits on '@'); a ':' separator is treated as part of the path
          inspect eval "tests/evaluation/thesis_eval.py@$TASK" \
            --model "$MODEL" \
            --log-dir logs/thesis_eval \
            --log-format json

      - name: Parse evaluation results
        id: parse-results
        run: |
          LOG_FILE=$(ls -t logs/thesis_eval/*.json 2>/dev/null | head -1)
          if [ -z "$LOG_FILE" ]; then
            echo "::error::No evaluation log found - infrastructure failure"
            exit 1
          fi
          ACCURACY=$(python -c "
          import json, sys
          with open('$LOG_FILE', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('status') != 'success':
              sys.exit('eval log status is not success - infrastructure failure')
          for score in (data.get('results') or {}).get('scores', []):
              metric = (score.get('metrics') or {}).get('accuracy')
              if metric is not None and isinstance(metric.get('value'), (int, float)):
                  print('{:.4f}'.format(metric['value']))
                  break
          else:
              sys.exit('no accuracy metric in eval log - infrastructure failure')
          ")
          echo "accuracy=$ACCURACY" >> "$GITHUB_OUTPUT"
          echo "Accuracy: $ACCURACY"

      - name: Check accuracy threshold
        id: check-threshold
        run: |
          ACCURACY="${{ steps.parse-results.outputs.accuracy }}"
          THRESHOLD="${{ env.ACCURACY_THRESHOLD }}"
          echo "Evaluation accuracy: $ACCURACY"
          echo "Threshold: $THRESHOLD"
          if (( $(echo "$ACCURACY < $THRESHOLD" | bc -l) )); then
            echo "low_accuracy=true" >> "$GITHUB_OUTPUT"
            echo "::error::Accuracy ($ACCURACY) is below threshold ($THRESHOLD)"
            exit 1
          fi
          echo "low_accuracy=false" >> "$GITHUB_OUTPUT"
          echo "Accuracy ($ACCURACY) meets threshold ($THRESHOLD)"

      - name: Upload evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-eval-logs
          path: logs/thesis_eval/
          retention-days: 30

      - name: Create summary
        if: always()
        run: |
          echo "## Thesis Classification Evaluation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Model | ${{ github.event.inputs.model || 'google/gemini-3.5-flash' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Solver | ${{ github.event.inputs.solver || 'thesis_with_cot' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accuracy | ${{ steps.parse-results.outputs.accuracy || 'none (infrastructure failure)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold | ${{ env.ACCURACY_THRESHOLD }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View full results in the uploaded artifacts." >> $GITHUB_STEP_SUMMARY

  close-failure-tracker:
    name: Close Failure Trackers on Recovery
    runs-on: ubuntu-latest
    needs: evaluate
    if: success()
    permissions:
      contents: read
      issues: write
    steps:
      # local composite actions cannot be resolved without a checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # a successful evaluation means accuracy is at/above threshold AND the
      # infrastructure worked, so both tracker labels are recovered
      - name: Close low-accuracy alert issue with green-run link
        uses: ./.github/actions/failure-issue
        with:
          mode: close
          title: 'Thesis Evaluation: Accuracy below threshold'
          label: thesis-eval-alert
          workflow-name: ${{ github.workflow }}
          body: |
            ## Recovered

            The weekly thesis evaluation completed with accuracy at or above
            threshold. Auto-closing this alert; the link below is the first
            green run after the tracked failure(s).

      - name: Close infrastructure failure issue with green-run link
        uses: ./.github/actions/failure-issue
        with:
          mode: close
          title: 'Thesis Evaluation: infrastructure failure'
          label: thesis-eval-infra
          workflow-name: ${{ github.workflow }}
          body: |
            ## Recovered

            The weekly thesis evaluation completed successfully. Auto-closing
            this infrastructure-failure tracker; the link below is the first
            green run after the tracked failure(s).

  notify-on-failure:
    name: Notify on Evaluation Failure
    runs-on: ubuntu-latest
    needs: evaluate
    if: always() && needs.evaluate.result == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Open or update low-accuracy alert issue
        if: needs.evaluate.outputs.low_accuracy == 'true'
        uses: ./.github/actions/failure-issue
        with:
          title: 'Thesis Evaluation: Accuracy below threshold'
          label: thesis-eval-alert
          workflow-name: ${{ github.workflow }}
          body: |
            ## Thesis Classification Accuracy Alert

            The weekly thesis classification evaluation completed and reported
            accuracy below threshold.

            | Metric | Value |
            |--------|-------|
            | Current Accuracy | ${{ needs.evaluate.outputs.accuracy }} |
            | Threshold | ${{ env.ACCURACY_THRESHOLD }} |

            ### Actions Required
            1. Review recent changes to thesis_matcher.py or llm_classifier.py
            2. Check the evaluation logs in the workflow artifacts
            3. Consider retraining or adjusting classification thresholds

      - name: Open or update infrastructure failure issue
        if: needs.evaluate.outputs.low_accuracy != 'true'
        uses: ./.github/actions/failure-issue
        with:
          title: 'Thesis Evaluation: infrastructure failure'
          label: thesis-eval-infra
          workflow-name: ${{ github.workflow }}
          body: |
            ## Thesis Evaluation Infrastructure Failure

            The evaluation job failed before producing a valid accuracy score.
            This is an infrastructure failure (task discovery, dependency
            install, provider access, or log parsing) - NOT a genuine
            below-threshold accuracy result.

            | Metric | Value |
            |--------|-------|
            | Reported Accuracy | ${{ needs.evaluate.outputs.accuracy || 'none (no score produced)' }} |
            | Threshold | ${{ env.ACCURACY_THRESHOLD }} |

            ### Actions Required
            1. Open the failed run below and inspect the evaluate job logs
            2. Verify the inspect_ai task selector and dependency install
            3. Re-run the workflow once the infrastructure issue is fixed
