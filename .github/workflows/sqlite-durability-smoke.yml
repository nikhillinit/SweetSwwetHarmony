name: SQLite Durability Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-durability-smoke:
    name: SQLite Durability Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pyyaml

      - name: Resolve current schema version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import ast
          from pathlib import Path

          source = Path("storage/signal_store.py").read_text(encoding="utf-8")
          module = ast.parse(source)
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "CURRENT_SCHEMA_VERSION":
                          print(f"CURRENT_SCHEMA_VERSION={ast.literal_eval(node.value)}")
                          raise SystemExit(0)
          raise SystemExit("CURRENT_SCHEMA_VERSION not found")
          PY

      - name: Run durability unit tests
        run: |
          python -m pytest \
            tests/scripts/test_sqlite_snapshot.py \
            tests/scripts/test_litestream_restore_verify.py \
            tests/utils/test_db_guard.py \
            -q

      - name: Build temp SQLite fixture
        shell: bash
        run: |
          mkdir -p artifacts/sqlite-durability-smoke
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          db_path = Path("artifacts/sqlite-durability-smoke/signals.db")
          conn = sqlite3.connect(db_path)
          try:
              conn.execute("CREATE TABLE schema_migrations (version INTEGER)")
              conn.execute(
                  "INSERT INTO schema_migrations (version) VALUES (?)",
                  (int(os.environ["CURRENT_SCHEMA_VERSION"]),),
              )
              conn.execute("CREATE TABLE signals (id INTEGER PRIMARY KEY)")
              conn.executemany(
                  "INSERT INTO signals (id) VALUES (?)",
                  [(1,), (2,), (3,)],
              )
              conn.commit()
          finally:
              conn.close()
          PY

      - name: Create local snapshot artifact
        run: |
          python -m scripts.sqlite_snapshot \
            --db-path artifacts/sqlite-durability-smoke/signals.db \
            --out-dir artifacts/sqlite-durability-smoke/snapshot \
            --manifest-out artifacts/sqlite-durability-smoke/latest.manifest.json

      - name: Run local durability check
        env:
          HARMONIC_ALLOW_IN_TREE_DB: "true"
          STRICT_CONFIG_VALIDATION: "false"
        run: |
          python run_pipeline.py sqlite-durability-check \
            --db-path artifacts/sqlite-durability-smoke/signals.db \
            --min-signals 3 \
            --expected-schema-version "$CURRENT_SCHEMA_VERSION" \
            --json
