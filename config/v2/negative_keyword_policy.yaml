# Negative Keyword Policy v2
#
# Phase 0A: Marker file (enables directory discovery)
# Phase 0B-1: Populated with NEGATIVE_KEYWORDS
# Phase 0B-2: ThesisMatcher scoring reads from this file
# Phase 1: 3-tier model with explicit tier field (hard_reject/hard_hold/soft)
#
# Schema contract:
# - version: required (str|int|float, coerced to string)
# - schema: required (format identifier for compatibility)
# - negative_keywords: required (dict, can be empty)
#   - <keyword>: dict with weight, category, and tier

version: "2.0"
schema: "negative_keyword_policy_v2"
description: "Negative keyword policy with 3-tier severity model (ADR-1)"

negative_keywords:
