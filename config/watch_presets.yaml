# Watch Presets Configuration
# These presets define extraction strategies for different page types.
# Loaded by PresetRegistry in monitoring/content_pipeline/presets.py
#
# Security mitigations:
#   - chompjs_timeout_ms: Max time for JSON extraction (prevent hangs)
#   - max_json_bytes: Limit extracted JSON size (prevent memory exhaustion)
#   - max_html_bytes: Limit raw HTML size (prevent memory exhaustion)

version: "1.0"

presets:
  default:
    description: "Default extraction for general websites"
    extractor:
      preset: "default"
      selectors:
        - "main"
        - "article"
        - "body"
      fallback_on_empty: true
    content_limits:
      max_html_bytes: 5242880   # 5 MB
      max_json_bytes: 2097152   # 2 MB
    transport:
      initial: "httpx"
      on_403: null
      on_429: null
      on_timeout: null

  pricing_table_v1:
    description: "Extract pricing tables from SaaS pricing pages"
    extractor:
      preset: "pricing"
      selectors:
        - "#pricing"
        - ".pricing"
        - ".pricing-table"
        - ".plans"
        - "[data-testid='pricing']"
        - "main"
      fallback_on_empty: true
      config:
        with_whitespace: true   # Preserve table formatting
    severity_boost: 0.15        # Pricing changes are high-severity signals
    content_limits:
      max_html_bytes: 5242880   # 5 MB
      max_json_bytes: 2097152   # 2 MB
    transport:
      initial: "httpx"
      on_403: "curl_cffi"       # Some pricing pages block bots
      on_429: null
      on_timeout: null

  blog_post_v1:
    description: "Extract blog posts and articles"
    extractor:
      preset: "article"
      selectors:
        - "article"
        - ".post-content"
        - ".article-body"
        - ".blog-post"
        - ".entry-content"
        - "main"
      fallback_on_empty: true
    content_limits:
      max_html_bytes: 5242880   # 5 MB
      max_json_bytes: 2097152   # 2 MB
    transport:
      initial: "httpx"
      on_403: "playwright"      # Some news sites require JS
      on_429: null
      on_timeout: null

  spa_hydration_v1:
    description: "Extract Next.js/React SPA hydration data (__NEXT_DATA__, etc.)"
    extractor:
      preset: "spa"
      selectors:
        - "#__NEXT_DATA__"
        - "#__NUXT__"
        - "script[type='application/json']"
      fallback_on_empty: false  # Don't fall back - we specifically want JSON
      config:
        # chompjs configuration for JSON extraction
        chompjs:
          timeout_ms: 5000      # W2 mitigation: 5 second max parse time
          strict_mode: true
          max_size_bytes: 102400  # 100 KB max extracted JSON (W2 mitigation)
    content_limits:
      max_html_bytes: 5242880   # 5 MB
      max_json_bytes: 102400    # 100 KB - stricter for SPA to prevent DoS
    transport:
      initial: "playwright"     # SPAs require JavaScript execution
      on_403: null
      on_429: null
      on_timeout: null

  ats_api_v1:
    description: "Extract job listings via ATS API discovery (Greenhouse, Lever, etc.)"
    extractor:
      preset: "json"            # JSON preset for API responses (not HTML)
      selectors: null           # API responses, not HTML selectors
      fallback_on_empty: false
      config:
        providers:
          greenhouse:
            api_pattern: "boards.greenhouse.io/*/jobs/*"
            json_path: "$.jobs[*]"
          lever:
            api_pattern: "jobs.lever.co/*"
            json_path: "$.postings[*]"
          ashby:
            api_pattern: "jobs.ashbyhq.com/*"
            json_path: "$.jobs[*]"
          workable:
            api_pattern: "*.workable.com/api/*"
            json_path: "$.results[*]"
    content_limits:
      max_html_bytes: 5242880   # 5 MB (actually JSON for ATS)
      max_json_bytes: 2097152   # 2 MB
    transport:
      initial: "httpx"          # APIs don't need browser rendering
      on_403: null              # APIs rarely block, but may rate limit
      on_429: "exponential_backoff"
      on_timeout: null
